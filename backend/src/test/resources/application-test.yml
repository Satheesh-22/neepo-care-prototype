spring:
  datasource:
    url: jdbc:h2:mem:neepo_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: test
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  main:
    banner-mode: "off"

logging:
  level:
    org.hibernate.SQL: WARN

neepo:
  security:
    jwt-secret: test-only-secret-that-is-at-least-thirty-two-bytes
    jwt-expiration-minutes: 60
    issuer: neepo-care-test
