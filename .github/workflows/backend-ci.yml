name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - "database/**"
      - "docs/**"
      - "scripts/**"
      - ".claude/**"
      - "CLAUDE.md"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "contracts/**"
      - "database/**"
      - "docs/**"
      - "scripts/**"
      - ".claude/**"
      - "CLAUDE.md"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate pre-development contracts
        run: python3 scripts/validate-foundation.py

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode verify

      - name: Validate Compose file
        env:
          POSTGRES_DB: neepo_care
          POSTGRES_USER: neepo_user
          POSTGRES_PASSWORD: ci_only_password
          JWT_SECRET: ci_only_secret_at_least_32_chars
        run: docker compose config --quiet
