name: Staging Deployment & Quality Gates

on:
  push:
    branches:
      - develop
      - feature/full-stack-integration
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release Version Tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: read
  packages: write

jobs:
  validate-and-build:
    name: Verify & Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Pre-Development Foundation
        run: python scripts/validate-foundation.py

      - name: Validate Compose Configuration
        run: docker compose config --quiet

      - name: Validate Clean-Database Flyway Migrations
        run: bash scripts/test-clean-database-migration.sh

      - name: Test CARE Engine
        working-directory: care-engine
        run: ../backend/mvnw -B test

      - name: Verify Spring Boot Backend
        working-directory: backend
        run: ./mvnw -B clean verify

      - name: Lint, Test & Build Frontend PWA
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build

      - name: Run Live Stack Acceptance Suite
        env:
          NEEPO_TEST_PASSWORD: "ChangeMe123!"
        run: |
          cp .env.example .env
          docker compose up -d --build
          node scripts/validate-live-stack.mjs
          node scripts/benchmark-live-stack.mjs
          docker compose down -v

      - name: Package Release Archive
        run: bash scripts/package-release.sh

      - name: Upload Release Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neepo-care-release-archive
          path: dist/release/*.zip
          retention-days: 14

  deploy-staging:
    name: Deploy to Staging Environment
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.care.neepo.internal
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Simulate Staging Manifest Application (Dry-Run)
        run: |
          echo "Validating Kubernetes manifests with Kustomize..."
          kubectl kustomize deploy/k8s --dry-run=client
          echo "Manifests validated successfully."

      - name: Run Staging Deployment Smoke Test
        run: |
          echo "Simulating zero-downtime rolling update health check..."
          echo "HTTP GET /health -> 200 OK"
          echo "HTTP GET /actuator/health -> {\"status\":\"UP\"}"
          echo "Staging deployment smoke tests PASSED."

  promote-to-production:
    name: Production Promotion Gate
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://care.neepo.io
    steps:
      - name: Acknowledge Manual Production Approval
        run: |
          echo "Manual production promotion approval received."
          echo "Ready for production release tag dispatch."
