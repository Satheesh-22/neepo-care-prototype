name: NEEPO-CARE CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  foundation-and-contracts:
    name: Foundation & Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate pre-development contracts
        run: python3 scripts/validate-foundation.py

  care-engine:
    name: CARE Engine Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run CARE-engine tests
        working-directory: care-engine
        run: ../backend/mvnw --batch-mode verify

  backend:
    name: Backend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests and verify
        working-directory: backend
        run: ./mvnw --batch-mode verify

  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend linter
        working-directory: frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test -- --run

      - name: Run frontend production build
        working-directory: frontend
        run: npm run build

  compose-config:
    name: Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          POSTGRES_DB: neepo_care
          POSTGRES_USER: neepo_user
          POSTGRES_PASSWORD: ci_only_secret_password_123
          JWT_SECRET: ci_only_secret_jwt_32_bytes_long_value
        run: docker compose config --quiet

  clean-database-migration:
    name: Clean Database Migration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run clean database migration test
        run: bash scripts/test-clean-database-migration.sh

  live-acceptance:
    name: Live Full-Stack Acceptance
    runs-on: ubuntu-latest
    needs: [foundation-and-contracts, care-engine, backend, frontend, compose-config, clean-database-migration]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create CI environment configuration
        run: |
          cp .env.example .env
          sed -i 's/local_postgres_password_123/ci_test_password_123/g' .env
          sed -i 's/neepo_care_prototype_super_secure_jwt_secret_32_bytes_long/ci_test_jwt_secret_32_bytes_long/g' .env

      - name: Start Docker Compose stack
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Wait for service health
        run: |
          timeout 90 bash -c 'until curl -sf http://127.0.0.1:8080/actuator/health | grep -q "UP"; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:3000/health | grep -q "UP"; do sleep 2; done'

      - name: Run live-stack acceptance validator
        env:
          NEEPO_TEST_PASSWORD: "ChangeMe123!"
        run: node scripts/validate-live-stack.mjs

      - name: Tear down stack
        if: always()
        run: docker compose down -v
