openapi: 3.1.0
info:
  title: NEEPO-CARE API
  version: 1.0.0
  description: >-
    Frozen cross-module contract for the NEEPO-CARE prototype. Operations marked
    with x-implementation-status: planned are contracts for later milestones.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
security: []
x-future-default-security: bearerAuth

tags:
  - name: Authentication
  - name: Users
  - name: Fleet
  - name: Cargo
  - name: Providers
  - name: Trips
  - name: Telemetry
  - name: Disruptions
  - name: Recovery
  - name: Decisions
  - name: Metrics
  - name: Notifications
  - name: Compliance

paths:
  /auth/login:
    post:
      tags: [Authentication]
      security: []
      operationId: login
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /events/ticket:
    post:
      tags: [Authentication]
      operationId: issueWebSocketTicket
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Single-use WebSocket connection ticket issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketTicketSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    post:
      tags: [Users]
      operationId: createUser
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Users]
      operationId: listUsers
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageSuccessResponse'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      x-implementation-status: implemented
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      operationId: deleteUser
      x-implementation-status: implemented
      responses:
        '204':
          description: User deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /users/by-email:
    get:
      tags: [Users]
      operationId: getUserByEmail
      x-implementation-status: implemented
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /vehicles:
    post:
      tags: [Fleet]
      operationId: createVehicle
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
      responses:
        '201':
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /vehicles/{vehicleId}:
    get:
      tags: [Fleet]
      operationId: getVehicle
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Vehicle found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /drivers:
    post:
      tags: [Fleet]
      operationId: createDriver
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDriverRequest'
      responses:
        '201':
          description: Driver created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /drivers/{driverId}:
    get:
      tags: [Fleet]
      operationId: getDriver
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: Driver found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /cargo:
    post:
      tags: [Cargo]
      operationId: createCargo
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCargoRequest'
      responses:
        '201':
          description: Cargo created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /cargo/{cargoId}:
    get:
      tags: [Cargo]
      operationId: getCargo
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/CargoId'
      responses:
        '200':
          description: Cargo found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /providers:
    get:
      tags: [Providers]
      operationId: listProviders
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Provider list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderListSuccessResponse'

  /providers/{providerId}/availability:
    post:
      tags: [Providers]
      operationId: updateProviderAvailability
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderAvailabilityRequest'
      responses:
        '201':
          description: Provider availability observation recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /trips:
    post:
      tags: [Trips]
      operationId: createTrip
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /trips/{tripId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Trips]
      operationId: getTrip
      x-implementation-status: implemented
      responses:
        '200':
          description: Trip found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /trips/{tripId}/start:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      tags: [Trips]
      operationId: startTrip
      x-implementation-status: implemented
      responses:
        '200':
          description: Trip started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSuccessResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /trips/{tripId}/assign:
    post:
      tags: [Trips]
      operationId: assignTrip
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTripRequest'
      responses:
        '200':
          description: Trip resources assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSuccessResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /trips/{tripId}/telemetry/history:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Telemetry, Trips]
      operationId: getTripTelemetryHistory
      x-implementation-status: implemented
      parameters:
        - name: from
          in: query
          required: false
          description: UTC ISO-8601 lower bound timestamp
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: UTC ISO-8601 upper bound timestamp
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Maximum number of breadcrumb observations to return (default 500, max 2000)
          schema:
            type: integer
            default: 500
            minimum: 1
            maximum: 2000
      responses:
        '200':
          description: Chronological telemetry breadcrumb history for trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistorySuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /telemetry:
    post:
      tags: [Telemetry]
      operationId: ingestTelemetry
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryObservation'
      responses:
        '202':
          description: Telemetry accepted idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /trips/{tripId}/telemetry-policy:
    post:
      tags: [Telemetry]
      operationId: evaluateTelemetryPolicy
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryPolicyRequest'
      responses:
        '200':
          description: Persisted adaptive telemetry policy decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryPolicyDecisionSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /disruptions:
    post:
      tags: [Disruptions]
      operationId: reportDisruption
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisruptionRequest'
      responses:
        '202':
          description: Disruption accepted idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisruptionSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /trips/{tripId}/recovery-plans/generate:
    parameters:
      - $ref: '#/components/parameters/TripId'
    post:
      tags: [Recovery]
      operationId: generateRecoveryPlans
      x-implementation-status: implemented
      responses:
        '202':
          description: Plan generation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryPlanListSuccessResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /trips/{tripId}/recovery-plans:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Recovery]
      operationId: listRecoveryPlans
      x-implementation-status: implemented
      responses:
        '200':
          description: Recovery plans for the active disruption
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryPlanListSuccessResponse'

  /recovery-plans/{planId}/select:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    post:
      tags: [Recovery]
      operationId: selectRecoveryPlan
      x-implementation-status: planned
      responses:
        '200':
          description: Plan selected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryPlanSuccessResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /recovery-plans/{planId}/invalidate:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    post:
      tags: [Recovery]
      operationId: invalidateRecoveryPlan
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvalidatePlanRequest'
      responses:
        '202':
          description: Plan invalidated and re-planning initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryPlanSuccessResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /trips/{tripId}/decision-explanation:
    get:
      tags: [Decisions]
      operationId: getDecisionExplanation
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Latest decision explanation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionExplanationSuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /trips/{tripId}/metrics:
    get:
      tags: [Metrics]
      operationId: getTripMetrics
      x-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: CARE and baseline metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripMetricsSuccessResponse'

  /notifications/channels:
    get:
      tags: [Notifications]
      operationId: getNotificationChannels
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of configured notification channels for company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannelListSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Notifications]
      operationId: createNotificationChannel
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationChannelRequest'
      responses:
        '201':
          description: Notification channel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannelSuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/channels/{channelId}:
    delete:
      tags: [Notifications]
      operationId: deleteNotificationChannel
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204':
          description: Notification channel deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/channels/{channelId}/test:
    post:
      tags: [Notifications]
      operationId: testNotificationChannel
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Test alert ping dispatched and signed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTestResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/logs:
    get:
      tags: [Notifications]
      operationId: getNotificationDeliveryLogs
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Chronological list of notification delivery attempts and HMAC signatures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDeliveryLogListSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /compliance/exports/trip/{tripId}:
    post:
      tags: [Compliance]
      operationId: generateTripComplianceExport
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ComplianceExportType'
            default: FULL_TRIP_DOSSIER
        - name: format
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ComplianceExportFormat'
            default: JSON_LD
      responses:
        '200':
          description: Cryptographic compliance package generated with SHA-256 digest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceExportPackageSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /compliance/exports:
    get:
      tags: [Compliance]
      operationId: listComplianceExports
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: List of audit export manifests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceExportManifestListSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /compliance/exports/{manifestId}:
    get:
      tags: [Compliance]
      operationId: getComplianceExportManifest
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: manifestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audit export manifest details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceExportManifestSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /compliance/exports/{manifestId}/verify:
    post:
      tags: [Compliance]
      operationId: verifyComplianceExport
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: manifestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplianceVerificationRequest'
      responses:
        '200':
          description: Verification result comparing payload SHA-256 digest with registered manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceVerificationSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DriverId:
      name: driverId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CargoId:
      name: cargoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    UserRole:
      type: string
      enum: [ADMIN, DISPATCHER, DRIVER]
    TripStatus:
      type: string
      enum: [CREATED, ASSIGNED, IN_PROGRESS, DISRUPTED, RECOVERY_IN_PROGRESS, COMPLETED, CANCELLED]
    RecoveryPlanType:
      type: string
      enum: [WORKSHOP_REPAIR, SAFE_PARKING_MOBILE_MECHANIC, TOW_REPAIR_OR_TRANSFER, SUBSTITUTE_VEHICLE_TRANSFER, DRIVER_REST, EMERGENCY_ESCALATION]
    RecoveryPlanStatus:
      type: string
      enum: [GENERATED, EVALUATING, FEASIBLE, REJECTED, SELECTED, EXECUTING, INVALIDATED, COMPLETED, FAILED]

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          writeOnly: true
    LoginResult:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    WebSocketTicket:
      type: object
      additionalProperties: false
      required: [ticket, expiresAt]
      properties:
        ticket:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [name, email, phone, role, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 72
          writeOnly: true
          maxLength: 150
        phone:
          type: string
          pattern: '^\\+?[0-9]{10,15}$'
        role:
          $ref: '#/components/schemas/UserRole'
    User:
      type: object
      required: [id, name, email, phone, role, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateVehicleRequest:
