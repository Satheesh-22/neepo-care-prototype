    NotificationTestResult:
      type: object
      required: [channelId, status, message, signature, payload]
      properties:
        channelId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/NotificationDeliveryStatus'
        message:
          type: string
        signature:
          type: string
        payload:
          type: string

    NotificationTestResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/NotificationTestResult'

    NotificationDeliveryLog:
      type: object
      required: [id, channelId, companyId, disruptionType, severity, status, signature, payload, deliveredAt]
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        disruptionEventId:
          type: string
          format: uuid
          nullable: true
        disruptionType:
          type: string
        severity:
          $ref: '#/components/schemas/DisruptionSeverity'
        status:
          $ref: '#/components/schemas/NotificationDeliveryStatus'
        signature:
          type: string
        payload:
          type: string
        errorMessage:
          type: string
          nullable: true
        deliveredAt:
          type: string
          format: date-time

    NotificationDeliveryLogListSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/NotificationDeliveryLog'

    ComplianceExportType:
      type: string
      enum: [COLD_CHAIN_EXCURSION, CARE_DECISION_CHAIN, FULL_TRIP_DOSSIER]

    ComplianceExportFormat:
      type: string
      enum: [JSON_LD, CSV, PRINTABLE_HTML]

    ComplianceExportManifest:
      type: object
      required: [id, companyId, exportType, format, sha256Digest, recordCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
          nullable: true
        exportType:
          $ref: '#/components/schemas/ComplianceExportType'
        format:
          $ref: '#/components/schemas/ComplianceExportFormat'
        sha256Digest:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        recordCount:
          type: integer
          minimum: 0
        generatedByUserId:
          type: string
          format: uuid
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    ComplianceExportManifestSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ComplianceExportManifest'

    ComplianceExportManifestListSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ComplianceExportManifest'

    ComplianceExportPackage:
      type: object
      required: [manifest, rawPayload, mediaType, filename]
      properties:
        manifest:
          $ref: '#/components/schemas/ComplianceExportManifest'
        rawPayload:
          type: string
        mediaType:
          type: string
        filename:
          type: string

    ComplianceExportPackageSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ComplianceExportPackage'

    ComplianceVerificationRequest:
      type: object
      required: [payload]
      properties:
        payload:
          type: string

    ComplianceVerificationResult:
      type: object
      required: [manifestId, valid, expectedDigest, computedDigest, verifiedAt]
      properties:
        manifestId:
          type: string
          format: uuid
        valid:
          type: boolean
        expectedDigest:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        computedDigest:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        verifiedAt:
          type: string
          format: date-time
        message:
          type: string

    ComplianceVerificationSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ComplianceVerificationResult'


