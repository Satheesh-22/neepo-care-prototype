apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: neepo-backend-secrets
  namespace: neepo-prod
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: neepo-vault-store
    kind: SecretStore
  target:
    name: neepo-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: neepo/production/backend
        property: jwt_secret
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: neepo/production/database
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: neepo/production/redis
        property: password
    - secretKey: HARDWARE_DEVICE_HMAC_KEY
      remoteRef:
        key: neepo/production/hardware
        property: hmac_key
