apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: neepo-vault-store
  namespace: neepo-prod
spec:
  provider:
    vault:
      server: "https://vault.internal.neepo.io:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "neepo-backend-role"
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: neepo-aws-store
  namespace: neepo-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: "us-east-1"
      auth:
        jwt:
          serviceAccountRef:
            name: neepo-backend-sa
