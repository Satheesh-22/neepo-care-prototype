apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neepo-backend-hpa
  namespace: neepo-prod
  labels:
    app.kubernetes.io/name: neepo-backend
    app.kubernetes.io/part-of: neepo-care
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neepo-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
