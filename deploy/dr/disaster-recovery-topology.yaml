# Cross-Region Disaster Recovery Network & Global Traffic Management
# Multi-Region Health-Checking & Ingress Failover Definition

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neepo-dr-failover-ingress
  namespace: neepo-staging
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "15"
    nginx.ingress.kubernetes.io/custom-http-errors: "502,503,504"
    nginx.ingress.kubernetes.io/default-backend: frontend-standby-service
  labels:
    app.kubernetes.io/name: neepo-care
    app.kubernetes.io/component: ingress-dr
spec:
  rules:
    - host: dr.staging.neepo.local
      http:
        paths:
          - path: /api/v1/health/dr
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: geo-dns-traffic-policy
  namespace: neepo-staging
  labels:
    app.kubernetes.io/name: neepo-care
    app.kubernetes.io/component: geo-routing
data:
  dns-routing-policy.json: |
    {
      "routingPolicy": "FAILOVER",
      "healthCheck": {
        "path": "/actuator/health/readiness",
        "intervalSeconds": 5,
        "consecutiveFailuresThreshold": 3,
        "timeoutSeconds": 2
      },
      "primaryRegion": {
        "regionId": "us-east-1",
        "ingressEndpoint": "primary.staging.neepo.local",
        "weight": 100
      },
      "secondaryRegion": {
        "regionId": "us-west-2",
        "ingressEndpoint": "dr.staging.neepo.local",
        "weight": 0,
        "hotStandby": true
      },
      "failoverThresholds": {
        "maxReplicationLagSeconds": 5,
        "targetRtoSeconds": 30,
        "targetRpoSeconds": 5
      }
    }
